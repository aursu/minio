name: Upgrade old version tests

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Upgrade from ${{ matrix.old.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # 2019: upstream's scenario. The others: releases the fork's users run.
        old:
          - version: RELEASE.2019-12-19T22-52-26Z
            commit: 586614c73f902085465d07a1f854ca6c1efb9845
          - version: RELEASE.2024-10-13T13-34-11Z
            commit: d10bb7e1b667c2df72c394ef1fa52ab4a6802d0f
          - version: RELEASE.2025-03-12T18-04-18Z
            commit: dbf31af6cb0d5ea33b277b6e461cfea98262778e

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start upgrade tests
        env:
          OLD_VERSION: ${{ matrix.old.version }}
          OLD_COMMIT: ${{ matrix.old.commit }}
        run: |
          make test-upgrade
