name: Upgrade old version tests

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Upgrade from ${{ matrix.old.version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # Releases the fork's users run; 2025-04-22 is the last community
        # release with the full console. No pre-2020 release: see note 38.
        old:
          - version: RELEASE.2024-10-13T13-34-11Z
            commit: d10bb7e1b667c2df72c394ef1fa52ab4a6802d0f
          - version: RELEASE.2025-03-12T18-04-18Z
            commit: dbf31af6cb0d5ea33b277b6e461cfea98262778e
          - version: RELEASE.2025-04-22T22-12-26Z
            commit: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start upgrade tests
        env:
          OLD_VERSION: ${{ matrix.old.version }}
          OLD_COMMIT: ${{ matrix.old.commit }}
        run: |
          make test-upgrade
