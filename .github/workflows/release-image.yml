name: Release image

# Builds Dockerfile.release, checks the image (console login through
# Keycloak, version stamp) and, for a release tag, publishes it to
# ghcr.io/aursu/minio. Plan 04, step 3.2; fork/notes/18-release-workflow.md.
#
#   tag RELEASE.<UTC time>.aursu.N  -> build, check, push :<tag> and :latest
#   pull request touching the image -> build and check only
on:
  push:
    tags:
      - "RELEASE.*.aursu.*"

  pull_request:
    branches:
      - master
    paths:
      - Dockerfile.release
      - Dockerfile.release.dockerignore
      - .github/workflows/release-image.yml
      - buildscripts/gen-ldflags.go
      - buildscripts/install-mc.sh
      - dockerscripts/**
      - fork/test/bin/sso-smoke.sh
      - fork/test/.env.example

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/aursu/minio
  TEST_TAG: local/minio:ci

jobs:
  image:
    name: Build, check, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io/aursu/minio (tag builds only)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag is the release name; anything else is a development build.
      - name: Release name
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release=""
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            release="$GITHUB_REF_NAME"
            [[ $release =~ ^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z\.aursu\.[0-9]+$ ]] ||
              { echo "::error::tag $release is not RELEASE.<YYYY-MM-DDTHH-MM-SSZ>.aursu.<N>"; exit 1; }
          fi
          echo "release=$release" >>"$GITHUB_OUTPUT"
          echo "release: ${release:-<development build>}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64
          build-args: RELEASE=${{ steps.release.outputs.release }}
          tags: ${{ env.TEST_TAG }}
          load: true
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,scope=release-image,mode=max

      - name: Version stamp
        shell: bash
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint minio "$TEST_TAG" --version | head -n 1)"
          echo "$version"
          if [[ -n $RELEASE ]]; then
            [[ $version == "minio version $RELEASE (commit-id=$GITHUB_SHA)" ]] ||
              { echo "::error::expected minio version $RELEASE (commit-id=$GITHUB_SHA)"; exit 1; }
          fi

      - name: Console login through Keycloak
        run: TEST_ENV=../.env.example fork/test/bin/sso-smoke.sh "$TEST_TAG"

      - name: Log in to ghcr.io
        if: steps.release.outputs.release != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image pushed is the image checked above, not a rebuild.
      - name: Publish
        if: steps.release.outputs.release != ''
        shell: bash
        env:
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          for tag in "$RELEASE" latest; do
            docker tag "$TEST_TAG" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
